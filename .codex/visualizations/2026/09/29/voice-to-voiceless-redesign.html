<div id="voice-to-voiceless-redesign">
  <style>
    #voice-to-voiceless-redesign {
      background: #eef4f2;
      color: #17332e;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 680px;
      padding: 18px;
    }

    #voice-to-voiceless-redesign * { box-sizing: border-box; }
    #voice-to-voiceless-redesign .v2vl-window {
      background: #f8fbfa;
      border: 1px solid #d8e5e0;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(18, 63, 54, .16);
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: 640px;
      overflow: hidden;
    }

    #voice-to-voiceless-redesign .v2vl-sidebar {
      background: #075e54;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 24px 16px 18px;
    }

    #voice-to-voiceless-redesign .v2vl-brand {
      align-items: center;
      display: flex;
      font-size: 18px;
      font-weight: 750;
      gap: 10px;
      letter-spacing: -.02em;
      padding: 0 8px 30px;
    }

    #voice-to-voiceless-redesign .v2vl-brand-mark {
      align-items: center;
      background: #25d366;
      border-radius: 11px;
      color: #075e54;
      display: inline-flex;
      height: 34px;
      justify-content: center;
      width: 34px;
    }

    #voice-to-voiceless-redesign .v2vl-nav { display: grid; gap: 7px; }
    #voice-to-voiceless-redesign .v2vl-nav button {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 12px;
      color: #d9f7e5;
      cursor: pointer;
      display: flex;
      font: inherit;
      font-size: 14px;
      gap: 11px;
      padding: 12px 13px;
      text-align: left;
      transition: background .18s ease, transform .18s ease;
      width: 100%;
    }

    #voice-to-voiceless-redesign .v2vl-nav button:hover,
    #voice-to-voiceless-redesign .v2vl-nav button.is-active { background: #128c7e; color: #ffffff; }
    #voice-to-voiceless-redesign .v2vl-nav button:hover { transform: translateX(2px); }
    #voice-to-voiceless-redesign .v2vl-sidebar-spacer { flex: 1; }
    #voice-to-voiceless-redesign .v2vl-time {
      border-top: 1px solid rgba(217, 247, 229, .28);
      margin-top: 18px;
      padding: 17px 8px 0;
    }
    #voice-to-voiceless-redesign .v2vl-time-label { color: #bdebd0; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    #voice-to-voiceless-redesign .v2vl-time-value { font-size: 27px; font-weight: 800; letter-spacing: -.04em; margin-top: 5px; }

    #voice-to-voiceless-redesign .v2vl-main { padding: 24px 26px 26px; }
    #voice-to-voiceless-redesign .v2vl-header { align-items: flex-end; display: flex; justify-content: space-between; margin-bottom: 20px; }
    #voice-to-voiceless-redesign .v2vl-kicker { color: #128c7e; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    #voice-to-voiceless-redesign h1 { color: #17332e; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.04em; line-height: 1; margin: 5px 0 0; }
    #voice-to-voiceless-redesign .v2vl-header-note { color: #71847d; font-size: 12px; max-width: 230px; text-align: right; }

    #voice-to-voiceless-redesign .v2vl-grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #voice-to-voiceless-redesign .v2vl-tile {
      align-items: center;
      background: #ffffff;
      border: 1px solid #dbe7e2;
      border-radius: 15px;
      box-shadow: 0 7px 18px rgba(23, 51, 46, .06);
      color: #17332e;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
      min-height: 150px;
      padding: 18px;
      position: relative;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    #voice-to-voiceless-redesign .v2vl-tile:hover { border-color: #6acfa4; box-shadow: 0 10px 22px rgba(18, 140, 126, .13); transform: translateY(-2px); }
    #voice-to-voiceless-redesign .v2vl-tile.is-selected { border: 2px solid #25a66f; box-shadow: 0 0 0 4px rgba(37, 211, 102, .16); }
    #voice-to-voiceless-redesign .v2vl-icon { align-items: center; border-radius: 50%; display: flex; height: 44px; justify-content: center; width: 44px; }
    #voice-to-voiceless-redesign .v2vl-icon.green { background: #e2f4e8; color: #1ca964; }
    #voice-to-voiceless-redesign .v2vl-icon.blue { background: #e5f0f7; color: #278bd4; }
    #voice-to-voiceless-redesign .v2vl-icon.orange { background: #fff0de; color: #ed963b; }
    #voice-to-voiceless-redesign .v2vl-icon.purple { background: #f0e9fa; color: #9252d7; }
    #voice-to-voiceless-redesign .v2vl-icon.pink { background: #f9e8f2; color: #cc5b9d; }
    #voice-to-voiceless-redesign .v2vl-icon.gold { background: #fff4d8; color: #d29e18; }
    #voice-to-voiceless-redesign .v2vl-tile-label { font-size: 15px; font-weight: 700; }
    #voice-to-voiceless-redesign .v2vl-selected-mark { background: #25a66f; border: 3px solid #ffffff; border-radius: 50%; color: #ffffff; display: none; padding: 3px; position: absolute; right: 10px; top: 10px; }
    #voice-to-voiceless-redesign .v2vl-tile.is-selected .v2vl-selected-mark { display: inline-flex; }

    #voice-to-voiceless-redesign .v2vl-actions { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 18px; }
    #voice-to-voiceless-redesign .v2vl-action {
      align-items: center;
      background: #128c7e;
      border: 0;
      border-radius: 13px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      font: inherit;
      font-size: 15px;
      font-weight: 750;
      gap: 9px;
      justify-content: center;
      min-height: 52px;
      padding: 12px 18px;
      transition: background .18s ease, transform .18s ease;
    }
    #voice-to-voiceless-redesign .v2vl-action:hover { background: #075e54; transform: translateY(-1px); }
    #voice-to-voiceless-redesign .v2vl-status { color: #71847d; font-size: 11px; margin-top: 13px; text-align: center; }

    @media (max-width: 760px) {
      #voice-to-voiceless-redesign { padding: 8px; }
      #voice-to-voiceless-redesign .v2vl-window { grid-template-columns: 1fr; }
      #voice-to-voiceless-redesign .v2vl-sidebar { padding: 14px; }
      #voice-to-voiceless-redesign .v2vl-brand { padding-bottom: 14px; }
      #voice-to-voiceless-redesign .v2vl-nav { grid-template-columns: repeat(3, 1fr); }
      #voice-to-voiceless-redesign .v2vl-nav button { justify-content: center; padding: 10px 6px; }
      #voice-to-voiceless-redesign .v2vl-nav button span { display: none; }
      #voice-to-voiceless-redesign .v2vl-sidebar-spacer, #voice-to-voiceless-redesign .v2vl-time { display: none; }
      #voice-to-voiceless-redesign .v2vl-main { padding: 18px 14px; }
      #voice-to-voiceless-redesign .v2vl-header { align-items: flex-start; flex-direction: column; gap: 8px; }
      #voice-to-voiceless-redesign .v2vl-header-note { text-align: left; }
      #voice-to-voiceless-redesign .v2vl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #voice-to-voiceless-redesign .v2vl-tile { min-height: 130px; }
    }
  </style>

  <div class="v2vl-window" aria-label="VoiceToVoiceless redesigned patient communication interface">
    <aside class="v2vl-sidebar">
      <div class="v2vl-brand"><span class="v2vl-brand-mark"><i data-lucide="heart-pulse" aria-hidden="true"></i></span><span>VoiceToVoiceless</span></div>
      <nav class="v2vl-nav" aria-label="Main navigation">
        <button type="button" class="is-active"><i data-lucide="house" aria-hidden="true"></i><span>Home</span></button>
        <button type="button"><i data-lucide="accessibility" aria-hidden="true"></i><span>Accessibility</span></button>
        <button type="button"><i data-lucide="settings" aria-hidden="true"></i><span>Settings</span></button>
      </nav>
      <div class="v2vl-sidebar-spacer"></div>
      <button type="button" class="v2vl-nav"><i data-lucide="badge-info" aria-hidden="true"></i><span>Patient code</span></button>
      <div class="v2vl-time"><div class="v2vl-time-label">Current time</div><div class="v2vl-time-value">10:26 AM</div></div>
    </aside>

    <main class="v2vl-main">
      <header class="v2vl-header"><div><div class="v2vl-kicker">Patient communication</div><h1>How are you feeling?</h1></div><div class="v2vl-header-note">Choose a message with your gaze or by touch.</div></header>
      <section class="v2vl-grid" aria-label="Communication choices">
        <button type="button" class="v2vl-tile"><span class="v2vl-icon green"><i data-lucide="check" aria-hidden="true"></i></span><span class="v2vl-tile-label">Yes</span><span class="v2vl-selected-mark"><i data-lucide="check" aria-hidden="true"></i></span></button>
        <button type="button" class="v2vl-tile"><span class="v2vl-icon pink"><i data-lucide="x" aria-hidden="true"></i></span><span class="v2vl-tile-label">No</span><span class="v2vl-selected-mark"><i data-lucide="check" aria-hidden="true"></i></span></button>
        <button type="button" class="v2vl-tile"><span class="v2vl-icon purple"><i data-lucide="bath" aria-hidden="true"></i></span><span class="v2vl-tile-label">Bathroom</span><span class="v2vl-selected-mark"><i data-lucide="check" aria-hidden="true"></i></span></button>
        <button type="button" class="v2vl-tile"><span class="v2vl-icon orange"><i data-lucide="utensils" aria-hidden="true"></i></span><span class="v2vl-tile-label">Food</span><span class="v2vl-selected-mark"><i data-lucide="check" aria-hidden="true"></i></span></button>
        <button type="button" class="v2vl-tile"><span class="v2vl-icon blue"><i data-lucide="droplets" aria-hidden="true"></i></span><span class="v2vl-tile-label">Water</span><span class="v2vl-selected-mark"><i data-lucide="check" aria-hidden="true"></i></span></button>
        <button type="button" class="v2vl-tile"><span class="v2vl-icon blue"><i data-lucide="pill" aria-hidden="true"></i></span><span class="v2vl-tile-label">Medication</span><span class="v2vl-selected-mark"><i data-lucide="check" aria-hidden="true"></i></span></button>
        <button type="button" class="v2vl-tile"><span class="v2vl-icon gold"><i data-lucide="frown" aria-hidden="true"></i></span><span class="v2vl-tile-label">Pain</span><span class="v2vl-selected-mark"><i data-lucide="check" aria-hidden="true"></i></span></button>
        <button type="button" class="v2vl-tile"><span class="v2vl-icon blue"><i data-lucide="bed-double" aria-hidden="true"></i></span><span class="v2vl-tile-label">Sleep</span><span class="v2vl-selected-mark"><i data-lucide="check" aria-hidden="true"></i></span></button>
        <button type="button" class="v2vl-tile"><span class="v2vl-icon pink"><i data-lucide="message-circle" aria-hidden="true"></i></span><span class="v2vl-tile-label">Talk to someone</span><span class="v2vl-selected-mark"><i data-lucide="check" aria-hidden="true"></i></span></button>
      </section>
      <div class="v2vl-actions"><button type="button" class="v2vl-action"><i data-lucide="scan-face" aria-hidden="true"></i>Start eye tracking</button><button type="button" class="v2vl-action"><i data-lucide="camera" aria-hidden="true"></i>Test live monitoring</button></div>
      <div class="v2vl-status">Eye tracking ready · Camera connected</div>
    </main>
  </div>

  <script>
    (() => {
      const root = document.getElementById('voice-to-voiceless-redesign');
      if (!root) return;
      root.querySelectorAll('.v2vl-tile').forEach(tile => tile.addEventListener('click', () => {
        root.querySelectorAll('.v2vl-tile').forEach(other => other.classList.remove('is-selected'));
        tile.classList.add('is-selected');
      }));
    })();
  </script>
</div>
