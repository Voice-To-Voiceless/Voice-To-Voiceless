name: Voice-To-Voiceless CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Python validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v2vl
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d v2vl"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install backend dependencies
        run: uv sync --project app

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/v2vl
        run: uv run --project app alembic -c app/database/alembic.ini upgrade head

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/v2vl
        run: uv run --project app pytest -q

      - name: Validate Python syntax
        run: uv run --project app python -m compileall app/backend app/database

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --runInBand

      - name: Check frontend types
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint