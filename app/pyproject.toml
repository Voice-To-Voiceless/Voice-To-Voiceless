[project]
name = "v2vl-backend"
version = "0.1.0"
description = "Voice-To-Voiceless backend services"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.alembic]
script_location = "app/database/alembic"
prepend_sys_path = ["."]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["backend/tests"]
